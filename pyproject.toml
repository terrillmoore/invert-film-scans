[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "invert-film-scans"
version = "0.2.0"
description = "Invert color negatives digitized with a digital camera"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE.md" }
authors = [{ name = "Terry Moore", email = "terrillmoore@yahoo.com" }]
keywords = ["film", "photography", "negative", "inversion", "camera scanning", "raw"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=2.0, ==2.*",
    "scipy>=1.13, ==1.*",
    "rawpy>=0.28, ==0.28.*",
    "tifffile>=2025.1",
    "rich>=13.0",
]

[project.urls]
Homepage = "https://github.com/terrillmoore/invert-film-scans"
Repository = "https://github.com/terrillmoore/invert-film-scans"
Issues = "https://github.com/terrillmoore/invert-film-scans/issues"

[project.scripts]
invert-film-scans = "invert_film_scans.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/invert_film_scans"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "invert_film_scans/resources/README.md"

[dependency-groups]
dev = [
    "pillow>=13.0, ==13.*",
    "pytest>=9.0, ==9.*",
    "ruff>=0.17, ==0.17.*",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

